<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>subagent-handoff</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1f26'/><rect x='2' y='4' width='12' height='3' fill='%2343a08e'/><rect x='2' y='9' width='12' height='3' fill='%23bd9047'/></svg>">
<!--
  視覺世界：航管進程條（flight progress strip bay）。決策與色值見 docs/ui-notes.md。
  每一筆請求是一張進條，在訂閱與第三方兩個席位之間被交接；異常的進條推出機架、批註印在條上。
  硬約束：零建置、零外部資源 —— 字型只用系統自帶的。CSS／JS 拆成 app.css／app.js 兩個
  同目錄的自帶檔（原本單檔 77KB 太肥），admin server 直接讀檔吐出，沒有 bundler。

  i18n：預設英文，navigator.language 抓不到 zh 開頭時就是它；語言選單見下面的
  <select id="lang">，切換時存 localStorage、重整仍記得。字典檔在 src/ui/i18n/，
  app.js 用相對路徑靜態 import，同樣沒有 bundler。這裡的中文／英文字面值只是
  JS 還沒接手前的初始畫面，app.js 一啟動就會用當前語言整批覆寫過去。
-->
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="titleblock">
  <h1>subagent-handoff</h1>
  <span class="num dim" id="binding" style="font-size:11px">–</span>
  <span class="spacer"></span>
  <label class="lbl" for="lang">Language</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="zh-Hant">繁體中文</option>
  </select>
  <span class="lbl" id="dirty-note">Config saved</span>
  <button class="btn go" id="save" disabled>Save</button>
</header>

<nav id="nav">
  <button data-tab="bay" aria-selected="true">Rack</button>
  <button data-tab="providers" aria-selected="false">Providers</button>
  <button data-tab="rules" aria-selected="false">Routing</button>
  <button data-tab="logs" aria-selected="false">Traffic</button>
  <button data-tab="advanced" aria-selected="false">Advanced</button>
  <button data-tab="setup" aria-selected="false">Connect</button>
</nav>

<div id="restart-note"></div>
<main id="view"></main>

<div id="toast" hidden><i></i><span></span></div>

<datalist id="model-hints">
  <option value="claude-opus-5"></option>
  <option value="claude-sonnet-5"></option>
  <option value="claude-haiku-4-5-20251001"></option>
  <option value="claude-fable-5"></option>
</datalist>

<script type="module" src="app.js"></script>
</body>
</html>
