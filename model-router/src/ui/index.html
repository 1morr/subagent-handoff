<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model-router</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1f26'/><rect x='2' y='4' width='12' height='3' fill='%2343a08e'/><rect x='2' y='9' width='12' height='3' fill='%23bd9047'/></svg>">
<!--
  視覺世界：航管進程條（flight progress strip bay）。決策與色值見專案根目錄 DESIGN.md。
  每一筆請求是一張進條，在訂閱與第三方兩個席位之間被交接；異常的進條推出機架、批註印在條上。
  硬約束：單一自帶檔、原生 JS、零建置、零外部資源 —— 字型只用系統自帶的。
-->
<style>
  :root {
    --bay: #1b1f26;      --recess: #151920;   --panel: #171b21;
    --rail: #2b323c;     --rail-lit: #3d4653;
    --on-bay: #dfe3e8;   --on-bay-dim: #8b939f;
    --stock: #e9e5db;    --ink: #1a1e24;      --ink-dim: #635c50;
    /* 席位編碼：兩色等明度等彩度、只變色相 —— 訂閱與第三方沒有高下之分。
       告警是唯一被允許打破這個色階的顏色（彩度明顯更高），所以它一出現就是被擋下了。 */
    --sub: #43a08e;      --prv: #ad8649;      --alarm: #e0563c;
    /* 告警當小級數文字時要再亮一階才過 4.5:1；色塊與粗體標題用 --alarm */
    --alarm-ink: #e8705a;
    /* Bahnschrift 與 Cascadia Mono 是 Windows 自帶，不下載任何東西。
       Bahnschrift 是 DIN 系壓縮體 —— 標誌系字體，正好是這個世界的聲音。 */
    --sign: "Bahnschrift SemiCondensed", Bahnschrift, "DIN Alternate", "Franklin Gothic Medium", system-ui, sans-serif;
    --data: "Cascadia Mono", ui-monospace, Consolas, "SF Mono", Menlo, monospace;
    --han: "Microsoft JhengHei UI", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bay); color: var(--on-bay);
    font: 13px/1.55 var(--han); -webkit-font-smoothing: antialiased;
  }
  a { color: #7fc7b8; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: #a5ded1; }
  ::selection { background: var(--sub); color: #10161a; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--recess); }
  ::-webkit-scrollbar-thumb { background: var(--rail); border: 2px solid var(--recess); }
  ::-webkit-scrollbar-thumb:hover { background: var(--rail-lit); }
  :focus-visible { outline: 2px solid var(--sub); outline-offset: 2px; }

  .sign { font-family: var(--sign); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  /* 漢字沒有 DIN 系壓縮體可用，uppercase 與 tracking 對它也是無效的 ——
     所以中文的顯示重量交給字重與級數，不假裝它是標牌體。見 DESIGN.md「字體」。 */
  .disp { font-family: var(--han); font-weight: 700; letter-spacing: 0; }
  .num  { font-family: var(--data); font-variant-numeric: tabular-nums; }
  .lbl  { font-family: var(--sign); font-weight: 500; letter-spacing: .10em;
          text-transform: uppercase; font-size: 10px; color: var(--on-bay-dim); }
  .spacer { flex: 1; }
  .dim { color: var(--on-bay-dim); }

  /* ── 標題塊：席位名牌與綁定資訊，不是導覽列 ───────────────────── */
  .titleblock {
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
    padding: 14px 26px 12px; border-bottom: 1px solid var(--rail);
  }
  .titleblock h1 { font: 600 21px/1 var(--sign); letter-spacing: .10em; margin: 0; text-transform: uppercase; }

  /* ── 機架 register：分頁是機架標籤，坐在導軌上 ─────────────────── */
  nav { display: flex; padding: 0 26px; border-bottom: 1px solid var(--rail); background: var(--panel); flex-wrap: wrap; }
  nav button {
    font: 600 12px/1 var(--sign); letter-spacing: .06em; text-transform: uppercase;
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 12px 17px 11px; color: var(--on-bay-dim); cursor: pointer;
  }
  nav button:hover { color: var(--on-bay); }
  nav button[aria-selected="true"] { color: var(--on-bay); border-bottom-color: var(--sub); }

  main { padding: 22px 26px 60px; display: flex; flex-direction: column; gap: 22px; }

  /* ── 控制項 ───────────────────────────────────────────────── */
  .btn {
    font: 600 11px/1 var(--sign); letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 13px; border: 1px solid var(--rail-lit); background: transparent;
    color: var(--on-bay-dim); cursor: pointer; border-radius: 0;
  }
  .btn:hover { background: rgba(255,255,255,.05); color: var(--on-bay); }
  .btn[aria-pressed="true"] { background: var(--sub); border-color: var(--sub); color: #10161a; }
  .btn.go { color: var(--sub); border-color: var(--sub); }
  .btn.warn { color: var(--prv); border-color: var(--prv); }
  .btn.danger { color: var(--alarm); border-color: var(--alarm); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn:disabled:hover { background: transparent; }
  .btn.tiny { padding: 5px 8px; font-size: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; }
  .btn > svg { flex: none; }

  .panel { background: var(--panel); border: 1px solid var(--rail); }
  .panel-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 16px; border-bottom: 1px solid var(--rail);
  }
  .panel-body { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .wide { grid-column: 1 / -1; }

  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld > .lbl { color: var(--on-bay-dim); }
  input[type=text], input[type=password], input[type=number], select, textarea {
    font: 12px/1.5 var(--data); font-variant-numeric: tabular-nums;
    padding: 8px 10px; border: 1px solid var(--rail); border-radius: 0;
    background: #10141a; color: var(--on-bay);
  }
  select { font-family: var(--han); font-size: 12.5px; }
  textarea { resize: vertical; min-height: 60px; }
  input:hover, select:hover, textarea:hover { border-color: var(--rail-lit); }
  .hint { font: 11px/1.6 var(--han); color: var(--on-bay-dim); }
  .hint code, code { font: 11.5px var(--data); color: #b6bcc5; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-bay); }
  pre {
    background: #10141a; border: 1px solid var(--rail); padding: 12px; margin: 0;
    overflow-x: auto; font: 12px/1.6 var(--data); color: var(--on-bay);
  }

  /* 說明貼著它解釋的控制項出現，不當開場白。單邊色條只在整塊警示上、且是結構的一部分 */
  .marginal { display: grid; grid-template-columns: 4px 1fr; border: 1px solid var(--rail); background: var(--panel); }
  .marginal > i { background: var(--rail-lit); }
  .marginal > div { padding: 11px 14px; font: 12px/1.65 var(--han); color: #a8b0bb; }
  .marginal.alarm { border-color: #4a2a24; background: #22181a; }
  .marginal.alarm > i { background: var(--alarm); }
  .marginal.alarm > div { color: #d8bdb5; }
  .marginal.note { border-color: #4a4128; background: #211d13; }
  .marginal.note > i { background: var(--prv); }
  .marginal.note > div { color: #cbbd9e; }

  /* ── 進條：方角印刷卡條。席位色是實心標籤塊，不是彩色左邊框 ─────── */
  .rack {
    display: flex; flex-direction: column; gap: 3px;
    background: var(--recess); border: 1px solid var(--rail); padding: 3px 36px 3px 3px;
  }
  .rackhead {
    display: grid; background: var(--panel); border: 1px solid var(--rail); border-bottom: 0;
    margin-right: 33px; padding-left: 3px;
  }
  .rackhead > span { padding: 6px 10px; }
  .slot { transition: transform .18s cubic-bezier(.16,1,.3,1); }
  /* 只有新到的那幾張會播，而且只播一次：閒置時整面機架是死的 */
  @keyframes printed { from { opacity: 0; transform: translateY(-9px); } }
  .slot.fresh > .strip { animation: printed .26s cubic-bezier(.16,1,.3,1); }
  @media (prefers-reduced-motion: reduce) {
    .slot, .strip, .band > div, .load > i, .clearance { transition: none; }
    .slot.fresh > .strip { animation: none; }
  }
  .slot.chk  { transform: translateX(14px); }
  .slot.hold { transform: translateX(30px); box-shadow: 0 0 0 2px var(--alarm); }
  .strip {
    display: grid; grid-template-columns: 46px 1fr; width: 100%; padding: 0; border: 0;
    background: var(--stock); color: var(--ink); font: inherit; text-align: left; cursor: pointer;
    transition: transform .16s cubic-bezier(.16,1,.3,1);
  }
  .strip:hover { transform: translateX(4px); }
  .tab {
    display: grid; place-items: center; align-content: center; gap: 1px;
    padding: 7px 0; color: #10161a; background: var(--rail-lit);
  }
  .tab.sub { background: var(--sub); } .tab.prv { background: var(--prv); }
  .tab .code { font: 600 11px/1 var(--sign); letter-spacing: .06em; }
  /* CHK / HOLD 的旗標翻成反白小塊 —— 第三個通道走明度與形狀，不再多發一個色相
     （多一個色相就會跟席位編碼的琥珀撞義） */
  .tab .flag { font: 600 10px/1 var(--sign); letter-spacing: .08em; padding: 1px 4px; }
  .slot.chk .tab .flag, .slot.hold .tab .flag { background: rgba(16,22,26,.86); }
  .slot.chk .tab.sub .flag, .slot.hold .tab.sub .flag { color: var(--sub); }
  .slot.chk .tab.prv .flag, .slot.hold .tab.prv .flag { color: var(--prv); }
  .slot.chk .tab:not(.sub):not(.prv) .flag, .slot.hold .tab:not(.sub):not(.prv) .flag { color: #cfd5dd; }
  .cells { display: grid; min-width: 0; }
  .cell {
    padding: 7px 10px; border-left: 1px solid rgba(26,30,36,.14); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 11px var(--data); font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .cell:first-child { border-left: 0; }
  .cell.han { font-family: var(--han); }
  .cell.dimink { color: var(--ink-dim); }
  .cell.bad { color: #a8321c; font-weight: 700; }
  .cell.warnink { color: #82590f; }
  .cell.okink { color: var(--ink); font-weight: 700; }

  /* 批註印在條上。這一塊就是舊版全部藏在 title tooltip 裡的東西 */
  .annot { display: grid; grid-template-columns: 46px 1fr; background: var(--stock); }
  .annot > .gutter { opacity: .34; }
  .annot > .body {
    padding: 10px 12px 12px; border-top: 1px solid rgba(26,30,36,.2); background: rgba(26,30,36,.045);
  }
  .annot dl { margin: 0; display: grid; grid-template-columns: 104px 1fr; gap: 3px 12px; }
  .annot dt { font: 500 10px/1.6 var(--sign); letter-spacing: .10em; text-transform: uppercase; color: var(--ink-dim); }
  .annot dd { margin: 0; font: 11.5px/1.55 var(--data); color: #3c4149; word-break: break-word; }
  .annot dd.bad { color: #8f2c18; }

  /* ── 分流帶：一條就回答「到底有沒有在分流」 ───────────────────── */
  .band { display: flex; height: 54px; background: var(--recess); border: 1px solid var(--rail); }
  .band > div {
    display: flex; align-items: center; gap: 10px; overflow: hidden; min-width: 0;
    transition: width .45s cubic-bezier(.16,1,.3,1);
  }
  .band > div > span:first-child { margin-left: 14px; }
  .band > div:last-child > span:last-child { margin-right: 14px; }
  .band .seg-sub { background: var(--sub); color: #10161a; }
  .band .seg-prv { background: var(--prv); color: #17130a; }
  .band .name { font: 600 13px/1 var(--sign); letter-spacing: .06em; white-space: nowrap; text-transform: uppercase; }
  .band .qty { font: 12px var(--data); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── 席位卡：負載是機架的形變（堆起來的格子），不是一顆數字徽章 ─── */
  .sectors { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .sector { display: grid; grid-template-columns: 8px 1fr; border: 1px solid var(--rail); background: var(--panel); }
  .sector > .edge { background: var(--rail-lit); }
  .sector.s-sub > .edge { background: var(--sub); }
  .sector.s-prv > .edge { background: var(--prv); }
  .sector > .in { padding: 14px 17px 15px; display: flex; flex-direction: column; gap: 13px; }
  .load { display: flex; align-items: flex-end; gap: 3px; height: 46px; }
  /* 不加 transition：每 3 秒輪詢會整段重繪，過場永遠播不到，留著只是一個會動版面的宣告 */
  .load > i { width: 9px; min-height: 2px; background: #2c333d; }
  .load > i.on.sub { background: var(--sub); } .load > i.on.prv { background: var(--prv); }
  .meter { width: 176px; height: 10px; background: #10141a; border: 1px solid var(--rail); display: flex; }
  .meter > i { background: var(--alarm); }

  /* ── 排程句：整條規則讀得出來，欄位本身就是句子裡的字段 ─────────── */
  .clearance { display: grid; grid-template-columns: 44px 1fr; transition: transform .18s cubic-bezier(.16,1,.3,1); }
  .clearance.hit { transform: translateX(12px); box-shadow: 0 0 0 2px var(--sub); }
  .clearance.shadowed { opacity: .4; }
  .clearance > .ord {
    display: grid; place-items: center; align-content: center; gap: 2px; padding: 8px 0;
    background: var(--rail); color: var(--on-bay-dim);
  }
  .clearance.hit > .ord { background: var(--sub); color: #10161a; }
  .clearance > .ord > b { font: 700 15px/1 var(--data); }
  .clearance > .ord > span { font: 500 8px/1 var(--sign); letter-spacing: .08em; opacity: .8; }
  .clearance > .say { background: var(--stock); color: var(--ink); }
  .clearance .line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 9px 11px; }
  .clearance .word { font: 12px var(--han); color: var(--ink-dim); }
  .clearance .reads {
    border-top: 1px solid rgba(26,30,36,.16); background: rgba(26,30,36,.045);
    padding: 7px 11px; font: 11.5px/1.6 var(--han); color: #5f6570;
  }
  /* 句子裡的字段：控制項本身，不是唯讀文字 —— 功能一項不掉 */
  .clearance select, .clearance input[type=text] {
    font: 12px var(--data); padding: 3px 7px; min-width: 0;
    background: rgba(26,30,36,.06); border: 1px solid rgba(26,30,36,.2); color: var(--ink);
  }
  .clearance select { font-family: var(--han); }
  .clearance select:hover, .clearance input[type=text]:hover { border-color: rgba(26,30,36,.45); }
  .clearance select.target { font-weight: 700; }
  .clearance select.target.prv { background: var(--prv); border-color: var(--prv); color: #17130a; }
  .clearance select.target.sub { background: var(--sub); border-color: var(--sub); color: #10161a; }
  .clearance .w-sm { width: 84px; } .clearance .w-md { width: 130px; }
  .arrow { flex: none; }

  /* ── 圖例：舊版靠 README 教你怎麼讀，這裡印在機架上 ─────────────── */
  .legend { display: flex; align-items: center; flex-wrap: wrap; border: 1px solid var(--rail); background: var(--panel); }
  .legend > div { display: flex; align-items: center; gap: 9px; padding: 9px 16px; border-right: 1px solid var(--rail); }
  .legend .chip { font: 600 10px/1 var(--sign); letter-spacing: .08em; padding: 3px 6px; color: #10161a; }

  .empty { padding: 26px; text-align: center; color: var(--on-bay-dim); }
  #restart-note:not(:empty) { padding: 0 26px; margin-top: 14px; }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: grid; grid-template-columns: 4px 1fr; max-width: min(560px, 92vw);
    background: var(--panel); border: 1px solid var(--rail); box-shadow: 0 8px 28px rgb(0 0 0 / .45);
  }
  #toast > i { background: var(--sub); }
  #toast > span { padding: 10px 14px; font-size: 12.5px; }
  #toast.bad { border-color: #4a2a24; } #toast.bad > i { background: var(--alarm); }
  #toast[hidden] { display: none; }

  @media (max-width: 820px) {
    .titleblock, nav, main, #restart-note:not(:empty) { padding-left: 14px; padding-right: 14px; }
    .rack { padding-right: 3px; }
    .slot.chk, .slot.hold { transform: none; }
    .slot.hold { box-shadow: 0 0 0 2px var(--alarm); }
  }
</style>
</head>
<body>

<header class="titleblock">
  <h1>model-router</h1>
  <span class="num dim" id="binding" style="font-size:11px">–</span>
  <span class="spacer"></span>
  <span class="lbl" id="dirty-note">設定已儲存</span>
  <button class="btn go" id="save" disabled>儲存</button>
</header>

<nav id="nav">
  <button data-tab="bay" aria-selected="true">機架</button>
  <button data-tab="providers" aria-selected="false">Providers</button>
  <button data-tab="rules" aria-selected="false">路由</button>
  <button data-tab="logs" aria-selected="false">流量</button>
  <button data-tab="advanced" aria-selected="false">進階</button>
  <button data-tab="setup" aria-selected="false">接入</button>
</nav>

<div id="restart-note"></div>
<main id="view"></main>

<div id="toast" hidden><i></i><span></span></div>

<datalist id="model-hints">
  <option value="claude-opus-5"></option>
  <option value="claude-sonnet-5"></option>
  <option value="claude-haiku-4-5-20251001"></option>
  <option value="claude-fable-5"></option>
</datalist>

<script type="module">
const KEEP = '__keep__'
const PASSTHROUGH_TARGET = 'passthrough（訂閱）'

const S = {
  config: null, runtime: null, dirty: false, tab: 'bay',
  tests: {}, busy: {}, logs: [], open: null,
  logFilter: 'all',
  // 預覽的輸入也放 state，否則每次預覽完重繪都會被模板的預設值蓋回去
  preview: null, pvKind: 'subagent', pvModel: 'claude-opus-5', pvAgent: '',
  // 「交還給訂閱」的還原點：記下被改掉的規則原本指向哪裡
  flipBackup: null,
}
let logTimer = null
// 見過的進條 id。只有真的新到的那幾張會播「印進機架」，閒置時整面是死的。
const SEEN = new Set()

const $ = (sel) => document.querySelector(sel)

// 圖示一律畫出來，同一套 1.6 描邊、12px 網格 —— ＋ ↑ ✕ ⚠ 這些字元不是圖示系統
const ICON = {
  plus: '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>',
  up:   '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>',
  down: '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2.5 6.5 6 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>',
  del:  '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>',
  warn: '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5 11 10.5H1z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 5v2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/><circle cx="6" cy="9" r=".7" fill="currentColor"/></svg>',
}
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  })
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`)
  return json
}

let toastTimer = null
/** 取代 alert()：阻塞式對話框會卡住整個分頁，而這些訊息都不需要使用者回答。 */
function toast(message, kind = '') {
  const el = $('#toast')
  el.querySelector('span').textContent = message
  el.className = kind
  el.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.hidden = true }, 4000)
}

function markDirty() {
  S.dirty = true
  $('#save').disabled = false
  $('#dirty-note').textContent = '有未儲存的變更'
}

function applyState(payload) {
  S.config = payload.config
  S.runtime = payload.runtime
  S.dirty = false
  $('#save').disabled = true
  $('#dirty-note').textContent = '設定已儲存'
  $('#binding').textContent =
    `PROXY ${payload.runtime.boundProxyPort} · GUI ${payload.runtime.boundAdminPort} · ${payload.runtime.configPath}`
  const reasons = payload.runtime.restartReasons ?? []
  $('#restart-note').innerHTML = payload.runtime.restartRequired
    ? `<div class="marginal note"><i></i><div><strong>${esc(reasons.join('、')) || '設定'}已變更，要重新啟動 <code>npm start</code> 才會生效。</strong>
         其餘設定都是每筆請求現查的，儲存後即時生效。</div></div>`
    : ''
}

// ── headers 文字 ⇄ 物件 ────────────────────────────────────────────
function parseHeaders(text) {
  const out = {}
  for (const line of String(text).split('\n')) {
    const i = line.indexOf(':')
    if (i > 0) {
      const name = line.slice(0, i).trim()
      if (name) out[name] = line.slice(i + 1).trim()
    }
  }
  return out
}
const formatHeaders = (obj) => Object.entries(obj ?? {}).map(([k, v]) => `${k}: ${v}`).join('\n')

// ── 進條的判讀 ────────────────────────────────────────────────────
// 這一組函式是整個重設計的核心：舊版把這些答案全塞在 title tooltip 裡，
// 鍵盤取不到、觸控取不到、選不起來也複製不了，README 得用整節教人該把滑鼠移到哪。

/** 這一筆停在哪個席位。null = 還沒送出去（被擋在 router 這關） */
function sectorOf(e) {
  if (e.providerId) return 'prv'
  if (e.target === PASSTHROUGH_TARGET) return 'sub'
  return null
}

const isAborted = (e) => !!e.error && /abort/i.test(e.error)
const effortStripped = (e) => !!e.effort && e.sentEffort !== e.effort

/** 進行中 / 順利 / 有事發生 / 被擋下。顏色不是唯一訊號 —— 每一級都有機架位置與印字旗標。 */
function stateOf(e) {
  if (e.error && !isAborted(e)) return 'hold'
  if (e.status >= 400) return 'hold'
  if (e.status == null && !e.error) return 'live'
  if (isAborted(e)) return 'chk'
  if (e.detail) return 'chk'                    // 200 但串流裡夾著 error 事件
  if (effortStripped(e)) return 'chk'
  if (e.attempts > 1) return 'chk'
  if (e.pings) return 'chk'
  if (!e.cwd) return 'chk'
  return 'clr'
}
const FLAG = { clr: 'CLR', chk: 'CHK', hold: 'HOLD', live: '···' }

/** anthropic-ratelimit-*-reset 可能是 unix 秒數也可能是 RFC3339，兩種都認，都不是就原樣顯示。 */
function resetLabel(raw) {
  const at = /^\d+$/.test(raw) ? Number(raw) * 1000 : Date.parse(raw)
  if (!Number.isFinite(at)) return String(raw)
  const secs = Math.round((at - Date.now()) / 1000)
  return secs > 0 ? `${secs}s 後` : new Date(at).toTimeString().slice(0, 8)
}

/** 常駐在批註欄的一行摘要。航管的進條右側就是控制員寫字的地方。 */
function marginNote(e) {
  if (e.error && !isAborted(e)) return `router 連不上上游・${e.error}`
  if (isAborted(e)) return '不是錯誤・Claude Code 自己收手'
  if (e.status >= 400) {
    const reset = e.rateLimit?.['unified-reset']
    if (e.retryAfter) return `上游擋的・${e.retryAfter}s 後重試`
    if (reset) return `上游擋的・${resetLabel(reset)}重置`
    return '上游擋的・router 只是照實轉發'
  }
  if (e.detail) return '200 但串流裡夾著 error 事件'
  if (effortStripped(e)) return '/effort 被 dropFields 吃掉'
  if (e.attempts > 1) return `router 自己重送 ${e.attempts} 次才成功`
  if (e.pings) return `補了 ${e.pings} 個 keep-alive ping`
  if (!e.cwd && e.status != null) return e.sessionId ? 'cwd 表還沒建立' : '沒有 session id・不是 Claude Code 送來的'
  return ''
}

/** 攤開後印在條上的完整批註。 */
/** 回傳 [鍵, 值, 是否為失敗說明]。染紅只給第三項為 true 的行。 */
function annotation(e) {
  const rows = []
  if (e.detail) rows.push(['上游說法', e.detail, true])
  if (e.error) rows.push([isAborted(e) ? '中止' : 'router 連不上上游', e.error, !isAborted(e)])
  rows.push(['命中規則', e.ruleId ? `${e.ruleId} → ${e.target}` : `無規則命中 · ${e.target ?? '未送出'}`])
  if (e.attempts > 1) rows.push(['重送', `送出 ${e.attempts} 次 · ${(e.retries || []).join(' → ') || '原因未記錄'}`, true])
  if (e.retryAfter) rows.push(['retry-after', `${e.retryAfter}s`, true])
  if (e.rateLimit) {
    rows.push(['限流', Object.entries(e.rateLimit).map(([k, v]) => `${k}=${v}`).join(' · '), true])
    if (!e.retryAfter) rows.push(['倒數', '上游沒給 retry-after —— Claude Code 畫面上那個倒數是它自己算的'])
  }
  if (effortStripped(e)) {
    rows.push(['靜默降級', `送出時 /effort 被拿掉（${e.effort} → 無）。請求照樣 200，只是模型變笨`, true])
    rows.push(['修法', '到 Providers 把 output_config 從「移除的 body 欄位」拿掉'])
  }
  if (e.pings) rows.push(['keep-alive', `router 補了 ${e.pings} 個 ping · 上游安靜超過 60 秒`])
  if ((e.changes || []).length) rows.push(['送出前改寫', e.changes.join(' · ')])
  if (e.shape) {
    const s = e.shape
    rows.push(['請求形狀', [
      s.messages != null ? `${s.messages} 則 messages` : null,
      s.system ? '有 system' : '無 system',
      s.stream ? '串流' : '非串流',
      s.maxTokens != null ? `max_tokens ${s.maxTokens}` : null,
    ].filter(Boolean).join(' · ')])
  }
  rows.push(['目錄', e.cwd || '認不出來 —— 這個 session 的主對話還沒發過請求，cwd 表還沒建立'])
  rows.push(['session', e.sessionId || '沒有 —— 這一筆不是 Claude Code 送來的，是別的東西打到了 router 的埠'])
  if (e.agentId) rows.push(['agent id', e.agentId])
  if (e.requestId) rows.push(['request-id', e.requestId])
  rows.push(['時間', e.ts])
  return rows
}

/** 回傳已跳脫的 HTML —— 只有這裡會夾圖示，其餘欄位一律走 esc()。 */
function statusHtml(e) {
  if (e.error) return esc(e.error)
  if (e.status == null) return '…'
  let out = esc(String(e.status))
  if (e.status < 400 && e.detail) out += ' ' + ICON.warn
  if (e.attempts > 1) out += esc(` ×${e.attempts}`)
  return out
}

// ── 進條的繪製 ────────────────────────────────────────────────────
const COLS_BAY  = '46px 74px 92px 108px minmax(120px,1fr) 104px 68px 128px minmax(180px,1.4fr)'
const COLS_LOGS = '46px 74px 92px 108px 150px minmax(120px,1fr) 116px 68px 128px minmax(180px,1.4fr)'
const HEAD_BAY  = ['席位', '時間', '來源', '目錄', '實送 model', '狀態', '耗時', '思考', '批註']
const HEAD_LOGS = ['席位', '時間', '來源', '目錄', '要求 model', '實送 model', '狀態', '耗時', '思考', '批註']

function shortCwd(cwd) {
  if (!cwd) return '–'
  return cwd.split(/[\\/]/).filter(Boolean).at(-1) || cwd
}

function stripRow(e, withRequested) {
  const st = stateOf(e)
  const sec = sectorOf(e)
  const open = S.open === e.id
  const note = marginNote(e)
  const statusCls = st === 'hold' ? 'bad' : st === 'chk' ? 'warnink' : st === 'live' ? 'dimink' : 'okink'
  const cells = [
    `<span class="cell">${esc(e.ts.slice(11, 19))}</span>`,
    `<span class="cell">${esc(e.kind)}</span>`,
    `<span class="cell ${e.cwd ? '' : 'dimink'}">${esc(shortCwd(e.cwd))}</span>`,
    withRequested ? `<span class="cell">${esc(e.requestedModel ?? '–')}</span>` : '',
    `<span class="cell ${e.sentModel && e.sentModel !== e.requestedModel ? '' : 'dimink'}">${esc(e.sentModel ?? '–')}</span>`,
    `<span class="cell ${statusCls}">${statusHtml(e)}</span>`,
    `<span class="cell">${e.ms != null ? e.ms + 'ms' : '…'}</span>`,
    `<span class="cell ${effortStripped(e) ? 'bad' : 'dimink'}">${
      e.effort ? esc(effortStripped(e) ? `${e.effort} → 已移除` : e.effort) : '–'}</span>`,
    `<span class="cell han ${st === 'hold' ? 'bad' : 'dimink'}">${esc(note)}</span>`,
  ].join('')

  const body = open ? `
    <div class="annot">
      <div class="gutter ${sec === 'prv' ? 'prv' : 'sub'}" style="background:${sec === 'prv' ? 'var(--prv)' : sec === 'sub' ? 'var(--sub)' : 'var(--rail-lit)'}"></div>
      <div class="body"><dl>${annotation(e).map(([k, v, bad]) =>
        `<dt>${esc(k)}</dt><dd${bad ? ' class="bad"' : ''}>${esc(v)}</dd>`).join('')}</dl></div>
    </div>` : ''

  return `
    <div class="slot ${st}${SEEN.size && !SEEN.has(e.id) ? ' fresh' : ''}" data-eid="${e.id}">
      <button class="strip" data-act="toggle-strip" aria-expanded="${open}">
        <span class="tab ${sec ?? ''}">
          <span class="code">${sec ? sec.toUpperCase() : '???'}</span>
          <span class="flag">${FLAG[st]}</span>
        </span>
        <span class="cells" style="grid-template-columns:${(withRequested ? COLS_LOGS : COLS_BAY).replace('46px ', '')}">${cells}</span>
      </button>
      ${body}
    </div>`
}

function rack(entries, withRequested) {
  const cols = withRequested ? COLS_LOGS : COLS_BAY
  const head = withRequested ? HEAD_LOGS : HEAD_BAY
  if (!entries.length) {
    return `<div class="panel"><div class="empty">${
      S.logs.length ? '這個篩選底下沒有進條。' : '機架是空的 —— router 在聽，但一筆請求都還沒進來。'}</div></div>`
  }
  return `
    <div class="rackhead" style="grid-template-columns:${cols}">
      ${head.map((h) => `<span class="lbl">${h}</span>`).join('')}
    </div>
    <div class="rack">${entries.map((e) => stripRow(e, withRequested)).join('')}</div>`
}

// ── 機架總覽 ──────────────────────────────────────────────────────
/** 分流數字全部從流量記錄現算，不需要另一支 API。 */
function overview() {
  const cutoff = Date.now() - 5 * 60 * 1000
  const win = S.logs.filter((e) => Date.parse(e.ts) >= cutoff)
  const sub = win.filter((e) => sectorOf(e) === 'sub')
  const prv = win.filter((e) => sectorOf(e) === 'prv')
  const routed = sub.length + prv.length
  const live = (list) => list.filter((e) => e.status == null && !e.error).length
  const subPct = routed ? Math.round(sub.length / routed * 100) : 0
  // 額度窗只有訂閱那條線會回 anthropic-ratelimit-*，取最近一筆有的
  const rl = S.logs.find((e) => sectorOf(e) === 'sub' && e.rateLimit)?.rateLimit ?? null
  const prvName = prv.find((e) => e.target)?.target
    ?? S.config.providers.find((p) => S.config.rules.some((r) => r.enabled && r.providerId === p.id))?.label
    ?? S.config.providers[0]?.label ?? '未設定'
  // 兩張席位卡共用同一個上限，否則兩邊的柱高不能互相比較
  const subBuckets = buckets(sub)
  const prvBuckets = buckets(prv)
  const peak = Math.max(1, ...subBuckets, ...prvBuckets)
  return {
    win, routed, sub, prv, subPct, prvPct: routed ? 100 - subPct : 0,
    subLive: live(sub), prvLive: live(prv), rl, prvName,
    subBuckets, prvBuckets, peak,
    blocked: win.filter((e) => stateOf(e) === 'hold').length,
  }
}

/** 近 4 分鐘切成 8 個 30 秒桶。柱高就是那 30 秒的請求數 —— 高度承載資料，不是裝飾。 */
function buckets(list) {
  const now = Date.now(), span = 30000, n = 8
  const out = new Array(n).fill(0)
  for (const e of list) {
    const age = now - Date.parse(e.ts)
    if (age >= 0 && age < span * n) out[n - 1 - Math.floor(age / span)]++
  }
  return out
}
const loadCells = (b, max, cls) => b.map((v) =>
  `<i class="${v ? 'on ' + cls : ''}" style="height:${max ? Math.round(2 + v / max * 42) : 2}px"></i>`).join('')

function renderBay() {

    return `
      <div class="fld" style="align-items:flex-end">

        <span class="num" style="font-size:11px;color:var(--alarm)">${
          Number.isFinite(rem) && Number.isFinite(lim) ? `${lim - rem} / ${lim}` : '限流資訊已回報'
        }${reset ? ` · ${esc(resetLabel(reset))}重置` : ''}</span>
      </div>`
  })() : `
      <div class="fld" style="align-items:flex-end">

    : `<div class="panel"><div class="empty">近 5 分鐘沒有流量。Claude Code 那頭指過來之後，這條帶子會顯示分流比例。</div></div>`

    <section class="fld" style="gap:9px">

        <span class="lbl">近 5 分鐘的分流</span>

        <span class="spacer"></span>
        <span class="hint">設定即時生效・下一個請求就改道</span>
      </div>
      ${band}

    <section class="sectors">
      <div class="sector s-sub"><div class="edge"></div><div class="in">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">

          <span style="font-weight:500">訂閱席位</span>
          <span class="spacer"></span>
          <span class="lbl">${toProvider ? '主對話' : '主對話 ＋ 所有子 agent'}</span>
        </div>
        <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
          <div class="load" title="近 4 分鐘，每格 30 秒">${loadCells(o.subBuckets, o.peak, 'sub')}</div>
          <div class="fld" style="gap:2px">
            <span class="num" style="font-size:22px;line-height:1">${o.subLive}</span>
            <span class="lbl">在途請求</span>
            <span class="lbl" style="letter-spacing:.04em">近 4 分鐘 ${o.sub.length} 筆</span>
          </div>

            S.config.passthrough.retry?.retryRateLimit === false ? ' · 節流不重送' : ''}</span>

          <div class="fld" style="gap:2px">

/** 圖例用的是機架上真正的夾條，不是另一組色票 —— 同一個顏色不能有兩個意思。 */
function flagLegend() {
  const sample = (st, sec, meaning) => `
    <div>
      <span class="slot ${st}" style="transform:none;box-shadow:none;display:inline-grid">
        <span class="tab ${sec}" style="padding:4px 7px"><span class="flag">${FLAG[st]}</span></span>
      </span>
      <span style="font-size:12px;color:#b6bcc5">${meaning}</span>
    </div>`
  return `
    <section class="legend">
      <span class="lbl" style="padding:9px 16px;border-right:1px solid var(--rail)">機架旗標</span>
      ${sample('clr', 'sub', '順利放行')}
      ${sample('chk', 'prv', '成功但有事發生・推出半格')}
      ${sample('hold', 'sub', '被擋下・推出整格＋整圈告警框')}
      <span class="spacer"></span>
      <span class="hint" style="padding:9px 16px">夾條顏色是<strong>席位</strong>（青＝訂閱、琥珀＝第三方），旗標與推出距離才是狀態</span>
    </section>`
}

function filteredLogs() {
  const f = S.logFilter
  if (f === 'all') return S.logs
  if (f === 'attn') return S.logs.filter((e) => ['chk', 'hold'].includes(stateOf(e)))
  return S.logs.filter((e) => e.kind === f)
}

// ── Providers ─────────────────────────────────────────────────────
const RETRY_FIELDS = [
  ['attempts', '重送次數', '0 = 關掉'],
  ['baseDelayMs', '退避起跳 (ms)', ''],
  ['maxDelayMs', '退避上限 (ms)', ''],
  ['maxRetryAfterMs', 'retry-after 上限 (ms)', '超過就交回 Claude Code'],
]

/**
 * 路由層的 retry 覆寫。欄位留空＝繼承全域，所以不需要另一個「要不要覆寫」的開關 ——
 * 空 / 有值這兩態跟 config 的稀疏語意一對一，看得到的就是存下去的。
 */
function retryTune(retry, scopeAttr = '') {
  const r = retry ?? {}
  const count = Object.keys(r).length
  return `
    <details class="wide"${scopeAttr} style="border:1px solid var(--rail);padding:9px 12px">
      <summary class="lbl" style="cursor:pointer">重試覆寫${count ? `（已覆寫 ${count} 項）` : '（留空＝繼承全域）'}</summary>
      <div class="grid" style="margin-top:11px">
        ${RETRY_FIELDS.map(([key, label, hint]) => `
          <label class="fld"><span class="lbl">${label}</span>
            <input type="number" min="0" data-f="retry.${key}" value="${r[key] ?? ''}" placeholder="繼承全域">
            ${hint ? `<span class="hint">${hint}</span>` : ''}
          </label>`).join('')}
        <label class="fld"><span class="lbl">節流（429）</span>
          <select data-f="retry.retryRateLimit">
            <option value="" ${r.retryRateLimit == null ? 'selected' : ''}>繼承全域</option>
            <option value="true" ${r.retryRateLimit === true ? 'selected' : ''}>重送</option>
            <option value="false" ${r.retryRateLimit === false ? 'selected' : ''}>不重送</option>
          </select>
        </label>
      </div>
    </details>`
}

function probeRow(r) {
  const cls = r.ok ? 'clr' : 'hold'
  return `
    <div class="slot ${cls}">
      <div class="strip" style="cursor:default">
        <span class="tab" style="background:${r.ok ? 'var(--sub)' : 'var(--alarm)'}">
          <span class="code">${r.ok ? 'PASS' : 'FAIL'}</span>
        </span>
        <span style="padding:9px 12px;display:flex;flex-direction:column;gap:4px;min-width:0">
          <span style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
            <span style="font-weight:700;color:var(--ink);font-size:12.5px">${esc(r.label)}</span>
            ${r.ms != null ? `<span class="num" style="font-size:11px;color:var(--ink-dim)">${r.ms}ms</span>` : ''}
          </span>
          ${r.detail ? `<span class="num" style="font-size:11px;color:var(--ink-dim);word-break:break-word">${esc(r.detail)}</span>` : ''}
          ${r.error ? `<span class="num" style="font-size:11px;color:#8f2c18;word-break:break-word">${esc(r.error)}</span>` : ''}
        </span>

    </div>`
}

// ── 路由規則 ───────────────────────────────────────────────────────
const MATCH_LABELS = {
  any: '任何請求',
  main: '只有主對話',
  subagent: '所有子 agent（含 Workflow / ultracode）',
  nested: '只有巢狀子 agent',
}

/** 這一筆會不會命中這條規則。跟 routing.mjs 同一套語意，用來在機架上標出被遮住的規則。 */
function globHit(pattern, value) {
  if (!pattern || pattern === '*') return true
  if (!value) return false
  const rx = new RegExp('^' + pattern.split('*').map((s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$')
  return rx.test(value)
}

function renderRules() {
  const targetOpts = (sel) => `
    <option value="" ${sel ? '' : 'selected'}>— 選一個導向 —</option>
    <option value="passthrough" ${sel === 'passthrough' ? 'selected' : ''}>SUB 訂閱</option>
    ${S.config.providers.map((p) =>
      `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>PRV ${esc(p.label)}</option>`).join('')}`

  // 預覽條件下，第一條命中的規則吃下這筆，它下面的全部被遮住
  const agentId = S.pvKind === 'main' ? '' : S.pvAgent
  let hitAt = -1
  const hits = S.config.rules.map((r, i) => {
    const ok = r.enabled && (r.match === 'any' || r.match === S.pvKind)
      && globHit(r.modelGlob, S.pvModel) && globHit(r.agentIdGlob ?? '*', agentId)
    if (ok && hitAt < 0) hitAt = i
    return ok
  })

  const rows = S.config.rules.map((r, i) => {
    const isHit = i === hitAt
    const shadowed = hitAt >= 0 && i > hitAt
    const toPrv = r.providerId && r.providerId !== 'passthrough'
    return `
    <div class="clearance ${isHit ? 'hit' : ''} ${shadowed ? 'shadowed' : ''}" data-rid="${esc(r.id)}">
      <div class="ord">
        <b>${i + 1}</b>
        <span>${isHit ? 'HIT' : shadowed ? 'SHDW' : r.enabled ? 'PASS' : 'OFF'}</span>
      </div>
      <div class="say">
        <div class="line">
          <label class="check" title="啟用"><input type="checkbox" data-f="enabled" ${r.enabled ? 'checked' : ''}></label>
          <select data-f="match">${Object.entries(MATCH_LABELS)
            .map(([k, v]) => `<option value="${k}" ${r.match === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <span class="word">・model</span>
          <input type="text" class="w-sm" data-f="modelGlob" value="${esc(r.modelGlob)}" title="model 名比對，支援 *">
          <span class="word">・agent</span>
          <input type="text" class="w-sm" data-f="agentIdGlob" value="${esc(r.agentIdGlob ?? '*')}"
                 title="比對 x-claude-code-agent-id，支援 *。* = 不篩">
          <svg class="arrow" width="20" height="12" viewBox="0 0 20 12" fill="none" aria-hidden="true">
            <path d="M0 6h16M12 2l4 4-4 4" stroke="rgba(26,30,36,.45)" stroke-width="1.4" stroke-linecap="square"/>
          </svg>
          <select class="target ${toPrv ? 'prv' : 'sub'}" data-f="providerId">${targetOpts(r.providerId)}</select>
          <span class="word">・送出</span>
          <input type="text" class="w-md" data-f="modelOverride" list="model-hints"
                 value="${esc(r.modelOverride ?? '')}" placeholder="不改寫">
          <span class="spacer"></span>
          <button class="btn tiny" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="上移">${ICON.up}</button>
          <button class="btn tiny" data-act="down" ${i === S.config.rules.length - 1 ? 'disabled' : ''} aria-label="下移">${ICON.down}</button>
          <button class="btn tiny danger" data-act="del-rule" aria-label="刪除規則">${ICON.del}</button>
        </div>
        ${isHit ? '<div class="reads">這一筆由這條吃下。下面的規則這次用不到。</div>' : ''}
      </div>
    </div>`
  }).join('')

  const pv = S.preview
  return `
    <section class="fld" style="gap:12px">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <span class="lbl">排程順序</span>
        <span class="hint">由上而下取第一條命中的；下面被遮住的那幾條這一筆用不到</span>
        <span class="spacer"></span>
        <button class="btn" data-act="add-rule">${ICON.plus} 新增規則</button>
      </div>
      <div class="rack" style="padding:4px 20px 4px 4px">
        ${rows || '<div class="empty">沒有規則，所有流量都走訂閱。</div>'}
        <div class="clearance" style="opacity:${hitAt < 0 ? 1 : .4}">
          <div class="ord" style="background:var(--rail)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2 11h12M8 2v7M5 6l3 3 3-3" stroke="var(--on-bay-dim)" stroke-width="1.4" stroke-linecap="square"/>
            </svg>
          </div>
          <div style="background:#20262e;border:1px dashed var(--rail-lit);border-left:0;display:flex;
                      align-items:center;gap:10px;padding:11px;flex-wrap:wrap">
            <span class="sign" style="font-size:12px;color:var(--sub)">SUB passthrough</span>
            <span class="hint">全部沒命中就落在這裡 —— 原樣送到 <code>${esc(S.config.passthrough.baseUrl)}</code>，由訂閱付帳</span>
            <span class="spacer"></span>
            <span class="lbl">機架底板・不可刪</span>
          </div>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
        <div class="marginal"><i></i><div>
          <strong>配額見底時</strong>，把規則的導向從 provider 換成 <code>SUB 訂閱</code> 就好 —— 不用刪規則、不用清 API key、不必重啟。設定是每筆請求現查的，正在跑的 agent 下一個請求就改道。
        </div></div>
        <div class="marginal"><i></i><div>
          <strong>為什麼不用「停用」</strong>：停用會讓流量掉到<strong>下一條</strong>規則，不是掉回訂閱。明確指向 passthrough 才是真的擋在那裡，而且排序還在。
        </div></div>
        <div class="marginal"><i></i><div>
          <strong>要涵蓋 ultracode 必須選「所有子 agent」</strong>。Workflow 的 <code>agent()</code> 算第一層子 agent、沒有 parent header，選「只有巢狀」一個都分流不到。
        </div></div>
        <div class="marginal"><i></i><div>
          <strong>agent 比對</strong>的用途是按 agent team 的角色分流：teammate 的 id 由名字衍生、跨重連穩定。一般 subagent 每次 spawn 重新產生，篩不出東西。主對話沒有這個 header，永遠不會被非 <code>*</code> 的樣式命中。
        </div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">排程預覽</span><span class="hint">不必真的 spawn 一個</span></div>
      <div class="panel-body" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <label class="fld"><span class="lbl">請求來源</span>
          <select id="pv-kind">${[['main', '主對話'], ['subagent', '子 agent'], ['nested', '巢狀子 agent']]
            .map(([k, v]) => `<option value="${k}" ${S.pvKind === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        </label>
        <label class="fld" style="flex:1;min-width:180px"><span class="lbl">請求的 model</span>
          <input type="text" id="pv-model" list="model-hints" value="${esc(S.pvModel)}">
        </label>
        <label class="fld" style="flex:1;min-width:150px"><span class="lbl">agent id・選填</span>
          <input type="text" id="pv-agent" value="${esc(S.pvAgent)}" placeholder="Explore-1">
        </label>
        <button class="btn go" data-act="preview">預覽</button>
      </div>
      ${pv ? `
      <div class="panel-body" style="border-top:1px solid var(--rail)">
        <div class="slot"><div class="strip" style="cursor:default">
          <span class="tab ${pv.providerId ? 'prv' : 'sub'}"><span class="code">${pv.providerId ? 'PRV' : 'SUB'}</span></span>
          <span class="body" style="padding:10px 13px">
            <dl style="margin:0;display:grid;grid-template-columns:80px 1fr;gap:3px 10px">
              <dt class="lbl" style="color:#8f8878">判定為</dt><dd style="margin:0;font:11.5px var(--data);color:#3c4149">${esc(pv.kind)}</dd>
              <dt class="lbl" style="color:#8f8878">導向</dt><dd style="margin:0;font:11.5px var(--data);color:var(--ink)">${esc(pv.target)}</dd>
              <dt class="lbl" style="color:#8f8878">實送 model</dt><dd style="margin:0;font:11.5px var(--data);color:var(--ink)">${
                pv.requestedModel === pv.sentModel ? esc(pv.sentModel) : `${esc(pv.requestedModel)} → ${esc(pv.sentModel)}`}</dd>
              <dt class="lbl" style="color:#8f8878">命中</dt><dd style="margin:0;font:11.5px var(--data);color:#3c4149">${
                pv.ruleId ? esc(pv.ruleId) : '無規則命中 · 掉到機架底板'}</dd>
            </dl>
          </span>
        </div></div>
      </div>` : ''}
    </section>`
}

  return `

          ['429 / 5xx', '上游擋的'],
          ['fetch failed', 'router 連不上上游'],

    ${flagLegend()}

        <span><b class="num">${list.length}</b> 筆</span>
        <span class="hint">每 3 秒更新・只記中繼資料，不記 prompt 內容</span>
        <span class="spacer"></span>

      ${rack(list, true)}

}

  return `
    <div class="marginal"><i></i><div>
      router 本身的設定。除了<strong>流量記錄的檔名與上限</strong>（落檔只在啟動時建立一次，改了要重啟），其餘都是每筆請求現查的，儲存後即時生效。
    </div></div>

    <section class="panel">
      <div class="panel-head"><span class="lbl">重試・全域預設</span></div>
      <div class="panel-body">
        <p class="hint" style="margin:0 0 14px">
          每個 provider 與 passthrough 都能在自己的卡片上覆寫其中幾項，沒覆寫的就用這裡的值。
          重送只發生在「一個 byte 都還沒寫給 client」的階段 —— 串流一旦開始就不能重來。
        </p>
        <div class="grid">
          <label class="fld"><span class="lbl">重送次數</span>
            <input type="number" min="0" max="10" data-g="retry.attempts" value="${r.attempts}">
            <span class="hint">0 = 關掉，所有錯誤原樣交回</span>
          </label>
          <label class="fld"><span class="lbl">退避起跳 (ms)</span>
            <input type="number" min="0" data-g="retry.baseDelayMs" value="${r.baseDelayMs}"></label>
          <label class="fld"><span class="lbl">退避上限 (ms)</span>
            <input type="number" min="0" data-g="retry.maxDelayMs" value="${r.maxDelayMs}"></label>
          <label class="fld"><span class="lbl">retry-after 上限 (ms)</span>
            <input type="number" min="0" data-g="retry.maxRetryAfterMs" value="${r.maxRetryAfterMs}">
            <span class="hint">上游要求等更久就不自己扛，交回去讓 Claude Code 顯示倒數</span>
          </label>
          <div class="fld wide">
            <label class="check"><input type="checkbox" data-g="retry.retryRateLimit" ${r.retryRateLimit ? 'checked' : ''}> 節流（429）也算可重送</label>
            <span class="hint">第三方的 429 通常等一下就過，所以預設開著。訂閱線相反 —— passthrough 預設就覆寫成不重送：它的 429 是 5 小時額度窗，退避幾秒等不到恢復。</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">預設去向・passthrough</span></div>
      <div class="panel-body grid">
        <label class="fld wide"><span class="lbl">Base URL</span>
          <input type="text" id="pt-base" value="${esc(S.config.passthrough.baseUrl)}">
          <span class="hint">所有規則都沒命中、以及規則明確指向 passthrough 時的去向。憑證與 header 原樣轉發，body 除了規則指定的 model 改寫之外一個字不動 —— 這條線就是你的訂閱。除非另外架了 Anthropic 前置，否則不要改。</span>
        </label>
        ${retryTune(S.config.passthrough.retry, ' data-scope="passthrough"')}
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">流量記錄落檔</span>
        <span class="lbl" style="border:1px solid var(--prv);color:var(--prv);padding:2px 7px">改了要重啟</span></div>
      <div class="panel-body grid">
        <label class="fld wide"><span class="lbl">檔名・相對於 config.json 所在目錄・留空＝不落檔</span>
          <input type="text" data-g="trafficLog.file" value="${esc(t.file)}" placeholder="traffic.log">
          <span class="hint">只有中繼資料，沒有 prompt；但含專案目錄與 session id，預設已進 .gitignore</span>
        </label>
        <label class="fld"><span class="lbl">輪替上限 (bytes)</span>
          <input type="number" min="10000" data-g="trafficLog.maxBytes" value="${t.maxBytes}">
          <span class="hint">超過就輪替成 <code>.1</code>，只留一份舊的，磁碟最多佔兩倍</span>
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">請求上限</span></div>
      <div class="panel-body">
        <label class="fld" style="max-width:320px"><span class="lbl">單一請求 body 上限 (bytes)</span>
          <input type="number" min="1000000" data-g="maxRequestBytes" value="${S.config.maxRequestBytes}">
          <span class="hint">router 為了能重送會把整包留在記憶體，這是防呆不是限流。1M context 的請求實測十幾 MB</span>
        </label>
      </div>
    </section>`
}

// ── 接入說明 ───────────────────────────────────────────────────────
function renderSetup() {
  const port = S.runtime.boundProxyPort
  return `
    <section class="panel">
      <div class="panel-head"><span class="lbl">1・設定 Claude Code</span></div>
      <div class="panel-body" style="display:flex;flex-direction:column;gap:12px">
        <p style="margin:0">在 <code>~/.claude/settings.json</code>（Windows：<code>%USERPROFILE%\\.claude\\settings.json</code>）的 <code>env</code> 區塊加入：</p>
        <pre id="snippet">{
  "env": {
    "ANTHROPIC_BASE_URL": "http://127.0.0.1:${port}",
    "CLAUDE_CODE_ATTRIBUTION_HEADER": "0"
  }
}</pre>
        <div><button class="btn" data-act="copy">複製</button></div>
        <div class="marginal alarm"><i></i><div>
          <strong>絕對不要</strong>同時設 <code>ANTHROPIC_AUTH_TOKEN</code>、<code>ANTHROPIC_API_KEY</code> 或 <code>apiKeyHelper</code>。
          官方文檔明載：只設 base URL 而不設憑證，claude.ai 訂閱登入會保留下來；一旦設了憑證，訂閱就整個被頂掉，全部流量改成按 token 計費。
        </div></div>
        <span class="hint">
          <code>CLAUDE_CODE_ATTRIBUTION_HEADER=0</code> 是選配。Claude Code 會在 system prompt 前面加一段 attribution block，只有 <code>api.anthropic.com</code> 會自動剝掉，第三方 provider 會把它當成 prompt 的一部分收下去。關掉比較乾淨。
        </span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">2・驗證訂閱還在</span></div>
      <div class="panel-body">
        <p style="margin:0 0 8px">重開 Claude Code，執行 <code>/status</code>，確認 <strong>Status</strong> 分頁上：</p>
        <ul style="margin:0 0 8px;padding-left:20px;line-height:1.8">
          <li><code>Anthropic base URL</code> 那行出現，指向 <code>http://127.0.0.1:${port}</code></li>
          <li>有 <code>Login method</code> 指向你的 claude.ai 帳號 —— <strong style="color:var(--alarm)">不是</strong> <code>Auth token</code> 或 <code>API key</code></li>
        </ul>
        <p style="margin:0">看到 <code>Auth token</code> 就代表訂閱被頂掉了，回頭檢查有沒有殘留的環境變數。</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">3・確認分流真的生效</span></div>
      <div class="panel-body">
        <p style="margin:0">在 Claude Code 裡叫一個子 agent 做任何事，然後回到<strong>機架</strong>分頁。分流帶應該分成兩段：主對話的請求走 <code>SUB 訂閱</code>，子 agent 的走 <code>PRV</code> 你設定的 provider。</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="lbl">已知限制</span></div>
      <div class="panel-body">
        <ul style="margin:0;padding-left:20px;line-height:1.8">
          <li>Anthropic 官方文檔明說不支援把 Claude Code 導到非 Claude 模型，壞了要自己修。</li>
          <li>Claude Code v2.1.196 起，<code>ANTHROPIC_BASE_URL</code> 指向非 Anthropic host 時 <strong>Remote Control 會停用</strong>。</li>
          <li><code>/fast</code> 的可用性檢查與 WebFetch 網域檢查直連 <code>api.anthropic.com</code>，不經過本 router。</li>
          <li>Claude Code 每次升級都可能新增 body 欄位，第三方 provider 收到會回 400；照錯誤訊息把欄位名加進該 provider 的「移除的 body 欄位」即可。</li>
          <li><code>/v1/messages/count_tokens</code> 若 provider 不支援會回 404，Claude Code 會自動退回用推論端點估算，不影響運作。</li>
        </ul>
      </div>
    </section>`
}

// ── render / 事件 ─────────────────────────────────────────────────
const VIEWS = { bay: renderBay, providers: renderProviders, rules: renderRules, logs: renderLogs, advanced: renderAdvanced, setup: renderSetup }

function render() {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)))
  const view = $('#view')
  if (!S.config) { view.innerHTML = '<div class="panel"><div class="empty">載入中…</div></div>'; return }
  view.innerHTML = VIEWS[S.tab]()
}

// 輸入時只更新 state，不重繪，避免游標跳走
document.addEventListener('input', (ev) => {
  const el = ev.target

  if (el.id === 'pt-base') { S.config.passthrough.baseUrl = el.value; markDirty(); return }

  // 進階分頁的全域設定：data-g="<群組>.<欄位>"，沒有點就是頂層欄位
  const g = el.dataset.g
  if (g) {
    const [group, key] = g.split('.')
    const target = key ? S.config[group] : S.config
    const name = key ?? group
    if (el.type === 'checkbox') target[name] = el.checked
    else if (el.type === 'number') target[name] = el.value === '' ? 0 : Number(el.value)
    else target[name] = el.value
    markDirty()
    return
  }

  const f = el.dataset.f
  if (!f) return

  // passthrough 的 retry 覆寫不在任何 provider 卡片裡，要先認出來
  if (f.startsWith('retry.') && el.closest('[data-scope="passthrough"]')) {
    applyRetryInput(S.config.passthrough, f.slice(6), el)
    markDirty()
    return
  }

  const card = el.closest('[data-pid]')
  const row = el.closest('[data-rid]')

  if (card) {
    if (f === 'testModel') { (S.tests[card.dataset.pid] ??= {}).model = el.value; return }
    const p = S.config.providers.find((x) => x.id === card.dataset.pid)
    if (!p) return
    if (f.startsWith('retry.')) applyRetryInput(p, f.slice(6), el)
    else if (f === 'dropFields') p.dropFields = el.value.split(',').map((s) => s.trim()).filter(Boolean)
    else if (f === 'extraHeaders') p.extraHeaders = parseHeaders(el.value)
    else if (f === 'maxOutputTokens') p.maxOutputTokens = el.value ? Number(el.value) : null
    else if (el.type === 'checkbox') p[f] = el.checked
    else p[f] = el.value
    markDirty()
  } else if (row) {
    const r = S.config.rules.find((x) => x.id === row.dataset.rid)
    if (!r) return
    r[f] = el.type === 'checkbox' ? el.checked : el.value
    markDirty()
  }
})

/** 把一格 retry 覆寫的輸入寫回稀疏物件；清空就把那個鍵拿掉，全空就回到 null。 */
function applyRetryInput(owner, key, el) {
  const next = { ...(owner.retry ?? {}) }
  if (el.value === '') delete next[key]
  else if (key === 'retryRateLimit') next[key] = el.value === 'true'
  else next[key] = Number(el.value)
  owner.retry = Object.keys(next).length ? next : null
}

// 導向、啟用、比對條件改了要重繪：機架上的 HIT / SHDW 標記跟著變
document.addEventListener('change', (ev) => {
  const f = ev.target.dataset.f
  if (!f || !ev.target.closest('[data-rid]')) return
  if (['providerId', 'enabled', 'match'].includes(f)) render()
})

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button')
  if (!btn) return

  if (btn.dataset.tab) {
    S.tab = btn.dataset.tab
    render()
    if (S.tab === 'logs' || S.tab === 'bay') startLogPolling(); else stopLogPolling()
    return
  }

  const act = btn.dataset.act
  if (!act) return
  const pid = btn.closest('[data-pid]')?.dataset.pid
  const rid = btn.closest('[data-rid]')?.dataset.rid
  const eid = btn.closest('[data-eid]')?.dataset.eid

  try {
    if (act === 'toggle-strip') {
      S.open = S.open === Number(eid) ? null : Number(eid)
      render()
    } else if (act === 'filter') {
      S.logFilter = btn.dataset.key
      render()
    } else if (act === 'add-provider') {
      S.config.providers.push({
        id: 'p-' + Math.random().toString(36).slice(2, 10),
        label: '新 Provider', baseUrl: '', apiKey: '', model: '', authStyle: 'bearer',
        dropFields: [],
        dropBeta: true, maxOutputTokens: null, retry: null, extraHeaders: {},
      })
      markDirty(); render()
    } else if (act === 'del-provider') {
      S.config.providers = S.config.providers.filter((p) => p.id !== pid)
      markDirty(); render()
    } else if (act === 'add-rule') {
      S.config.rules.push({
        id: 'r-' + Math.random().toString(36).slice(2, 10),
        enabled: true, match: 'subagent', modelGlob: '*', agentIdGlob: '*',
        providerId: S.config.providers[0]?.id ?? 'passthrough', modelOverride: '',
      })
      markDirty(); render()
    } else if (act === 'del-rule') {
      S.config.rules = S.config.rules.filter((r) => r.id !== rid)
      markDirty(); render()
    } else if (act === 'up' || act === 'down') {
      const i = S.config.rules.findIndex((r) => r.id === rid)
      const j = act === 'up' ? i - 1 : i + 1
      if (j >= 0 && j < S.config.rules.length) {
        ;[S.config.rules[i], S.config.rules[j]] = [S.config.rules[j], S.config.rules[i]]
        markDirty(); render()
      }
    } else if (act === 'flip' || act === 'unflip') {
      // 配額見底時最常做的動作，而且往往在 agent 正在跑的時候做 —— 所以直接存檔生效，
      // 不讓它停在「未儲存」。還原點記在 S.flipBackup，按一下就換回去。
      if (act === 'flip') {
        S.flipBackup = S.config.rules.map((r) => ({ id: r.id, providerId: r.providerId }))
        for (const r of S.config.rules) if (r.enabled && r.providerId !== 'passthrough') r.providerId = 'passthrough'
      } else {
        const back = new Map(S.flipBackup.map((b) => [b.id, b.providerId]))
        for (const r of S.config.rules) if (back.has(r.id)) r.providerId = back.get(r.id)
        S.flipBackup = null
      }
      applyState(await api('PUT', '/api/config', S.config))
      render()
      toast(act === 'flip' ? '所有子 agent 已交還給訂閱・下一個請求就改道' : '已重新收下子 agent')
    } else if (act === 'test') {
      const provider = S.config.providers.find((p) => p.id === pid)
      S.busy[pid] = true; render()
      try {
        const out = await api('POST', '/api/test', { provider, model: S.tests[pid]?.model })
        S.tests[pid] = { ...out, model: S.tests[pid]?.model ?? '' }
      } catch (err) {
        S.tests[pid] = { results: [{ id: 'x', label: '測試', ok: false, error: err.message }] }
      } finally {
        S.busy[pid] = false; render()
      }
    } else if (act === 'preview') {
      S.pvKind = $('#pv-kind').value
      S.pvModel = $('#pv-model').value
      S.pvAgent = $('#pv-agent').value
      S.preview = await api('POST', '/api/routing/preview', {
        kind: S.pvKind, model: S.pvModel, agentId: S.pvAgent, config: S.config,
      })
      render()
    } else if (act === 'clear-logs') {
      await api('POST', '/api/logs/clear'); S.logs = []; S.open = null; render()
    } else if (act === 'copy') {
      await navigator.clipboard.writeText($('#snippet').textContent)
      btn.textContent = '已複製'
      setTimeout(() => { btn.textContent = '複製' }, 1200)
    }
  } catch (err) {
    toast('操作失敗：' + err.message, 'bad')
  }
})

$('#save').addEventListener('click', async () => {
  const btn = $('#save')
  btn.disabled = true
  try {
    applyState(await api('PUT', '/api/config', S.config))
    render()
    toast('已儲存')
  } catch (err) {
    toast('儲存失敗：' + err.message, 'bad')
    btn.disabled = false
  }
})

function startLogPolling() {
  const tick = async () => {
    try {
      S.logs = (await api('GET', '/api/logs')).entries
      if (S.tab === 'logs' || S.tab === 'bay') render()
      for (const e of S.logs) SEEN.add(e.id)
    } catch {}
  }
  tick()
  stopLogPolling()
  logTimer = setInterval(tick, 3000)
}
function stopLogPolling() { if (logTimer) { clearInterval(logTimer); logTimer = null } }

applyState(await api('GET', '/api/state'))
render()
startLogPolling()
</script>
</body>
</html>
