<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model-router</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>🔀</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;      --panel: #ffffff;    --panel-2: #f0f2f5;
    --text: #16181d;    --muted: #646c7a;    --border: #dde1e8;
    --accent: #2f6df6;  --ok: #1a7f45;       --bad: #c02a35;   --warn: #9a6200;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d;    --panel: #1e2128;    --panel-2: #262a33;
      --text: #e6e8ec;  --muted: #949cab;    --border: #333944;
      --accent: #6a9bff; --ok: #4ec97f;      --bad: #ff7b85;   --warn: #e0aa4a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d;      --panel: #1e2128;    --panel-2: #262a33;
    --text: #e6e8ec;    --muted: #949cab;    --border: #333944;
    --accent: #6a9bff;  --ok: #4ec97f;       --bad: #ff7b85;   --warn: #e0aa4a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }

  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin: 16px 0 20px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  .bar .spacer { flex: 1; }
  .pill {
    font-family: var(--mono); font-size: 12px; padding: 3px 8px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; color: var(--muted);
  }

  nav { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 9px 14px; font: inherit; color: var(--muted); cursor: pointer; margin-bottom: -1px;
  }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  button.btn {
    font: inherit; padding: 6px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:disabled { opacity: .45; cursor: default; }
  button.btn.danger { color: var(--bad); }
  button.btn.tiny { padding: 3px 8px; font-size: 12px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; padding: 16px; margin-bottom: 14px;
  }
  .card h3 { margin: 0; font-size: 15px; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-head .spacer { flex: 1; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
  label.field.wide { grid-column: 1 / -1; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    font: inherit; padding: 7px 9px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input.mono, textarea.mono { font-family: var(--mono); font-size: 12.5px; }
  textarea { resize: vertical; min-height: 62px; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .tests { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .tests-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .result { display: flex; gap: 9px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .result:first-of-type { border-top: none; }
  .result .icon { flex: none; width: 16px; font-weight: 700; }
  .result .icon.ok { color: var(--ok); } .result .icon.bad { color: var(--bad); }
  .result .body { min-width: 0; }
  .result .name { font-weight: 600; }
  .result .detail { color: var(--muted); font-family: var(--mono); font-size: 12px; word-break: break-word; }
  .result .err { color: var(--bad); font-family: var(--mono); font-size: 12px; word-break: break-word; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  td.mono { font-family: var(--mono); font-size: 12px; }
  .scroll { overflow-x: auto; }

  .rule-row { display: grid; grid-template-columns: 28px 1.1fr 0.8fr 1.3fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 9px; }
  .rule-row > select, .rule-row > input[type=text] { min-width: 0; }
  .empty { color: var(--muted); padding: 22px; text-align: center; }
  .note {
    background: var(--panel-2); border-left: 3px solid var(--accent);
    padding: 11px 13px; border-radius: 0 8px 8px 0; margin-bottom: 14px; font-size: 13px;
  }
  .note.warn { border-left-color: var(--warn); }
  pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; margin: 0;
  }
  .status-ok { color: var(--ok); } .status-bad { color: var(--bad); } .status-muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>model-router</h1>
    <span class="sub">主 session 走訂閱，子 agent 分流到第三方</span>
  </header>

  <div class="bar">
    <span class="pill" id="pill-proxy">proxy –</span>
    <span class="pill" id="pill-admin">gui –</span>
    <span class="pill" id="pill-config">config –</span>
    <span class="spacer"></span>
    <span id="dirty-note" class="sub"></span>
    <button class="btn primary" id="save" disabled>儲存</button>
  </div>

  <div id="restart-note"></div>

  <nav>
    <button data-tab="providers" aria-selected="true">Providers</button>
    <button data-tab="rules" aria-selected="false">路由規則</button>
    <button data-tab="logs" aria-selected="false">流量記錄</button>
    <button data-tab="setup" aria-selected="false">接入說明</button>
  </nav>

  <main id="view"></main>
</div>

<script type="module">
const KEEP = '__keep__'
const S = {
  config: null, runtime: null, dirty: false, tab: 'providers', tests: {}, busy: {}, logs: [],
  // 預覽的輸入也放 state，否則每次預覽完重繪都會被模板的預設值蓋回去
  preview: null, pvKind: 'subagent', pvModel: 'claude-opus-5',
}
let logTimer = null

const $ = (sel) => document.querySelector(sel)
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  })
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`)
  return json
}

function markDirty() {
  S.dirty = true
  $('#save').disabled = false
  $('#dirty-note').textContent = '有未儲存的變更'
}

function applyState(payload) {
  S.config = payload.config
  S.runtime = payload.runtime
  S.dirty = false
  $('#save').disabled = true
  $('#dirty-note').textContent = ''
  $('#pill-proxy').textContent = `proxy :${payload.runtime.boundProxyPort}`
  $('#pill-admin').textContent = `gui :${payload.runtime.boundAdminPort}`
  $('#pill-config').textContent = payload.runtime.configPath
  $('#restart-note').innerHTML = payload.runtime.restartRequired
    ? '<div class="note warn">埠號已變更，需要重新啟動 <code>npm start</code> 才會生效。</div>'
    : ''
}

// ── headers 文字 ⇄ 物件 ────────────────────────────────────────────
function parseHeaders(text) {
  const out = {}
  for (const line of String(text).split('\n')) {
    const i = line.indexOf(':')
    if (i > 0) {
      const name = line.slice(0, i).trim()
      if (name) out[name] = line.slice(i + 1).trim()
    }
  }
  return out
}
const formatHeaders = (obj) => Object.entries(obj ?? {}).map(([k, v]) => `${k}: ${v}`).join('\n')

// ── Providers ─────────────────────────────────────────────────────
function providerCard(p) {
  const t = S.tests[p.id]
  const busy = S.busy[p.id]
  return `
  <section class="card" data-pid="${esc(p.id)}">
    <div class="card-head">
      <h3>${esc(p.label)}</h3>
      <span class="pill">${esc(p.id)}</span>
      <span class="spacer"></span>
      <button class="btn tiny danger" data-act="del-provider">刪除</button>
    </div>

    <div class="grid">
      <label class="field">名稱
        <input type="text" data-f="label" value="${esc(p.label)}">
      </label>
      <label class="field">Model（留空＝不改寫，原樣轉發）
        <input type="text" class="mono" data-f="model" value="${esc(p.model)}" placeholder="kimi-k3">
      </label>
      <label class="field wide">Base URL（Anthropic Messages 格式的端點）
        <input type="text" class="mono" data-f="baseUrl" value="${esc(p.baseUrl)}" placeholder="https://api.moonshot.ai/anthropic">
      </label>
      <label class="field wide">API Key
        <input type="password" class="mono" data-f="apiKey" value="${p.apiKey === KEEP ? KEEP : ''}"
               placeholder="${p.apiKeyHint ? `目前：${esc(p.apiKeyHint)}（不動就保留）` : '尚未設定'}">
        <span class="hint">存進 config.json 明文，該檔已在 .gitignore。</span>
      </label>
      <label class="field">認證 header
        <select data-f="authStyle">
          <option value="bearer" ${p.authStyle === 'bearer' ? 'selected' : ''}>Authorization: Bearer</option>
          <option value="x-api-key" ${p.authStyle === 'x-api-key' ? 'selected' : ''}>x-api-key</option>
        </select>
      </label>
      <label class="field">max_tokens 上限（留空＝不夾）
        <input type="number" min="1" data-f="maxOutputTokens" value="${p.maxOutputTokens ?? ''}">
      </label>
      <label class="field wide">移除的 body 欄位（逗號分隔，建議留空）
        <input type="text" class="mono" data-f="dropFields" value="${esc((p.dropFields || []).join(', '))}"
               placeholder="留空＝原樣轉發">
        <span class="hint">只在上游回 <code>400 unknown field</code> 時才照錯誤訊息填。
          刪 <code>output_config</code> 會讓 <code>/effort</code> 靜默失效，
          刪 <code>thinking</code> 會讓 <code>kimi-k2.7-code</code> 直接拒收。</span>
      </label>
      <label class="field wide">額外 header（每行一組 Name: Value）
        <textarea class="mono" data-f="extraHeaders" placeholder="X-Tenant: acme">${esc(formatHeaders(p.extraHeaders))}</textarea>
      </label>
      <label class="field wide">
        <span class="check"><input type="checkbox" data-f="dropBeta" ${p.dropBeta ? 'checked' : ''}> 移除 <code>anthropic-beta</code> header</span>
        <span class="hint">裡面是 Anthropic 專屬 capability，第三方通常拒收。passthrough 那條線永遠原樣保留，不受此設定影響。</span>
      </label>
    </div>

    <div class="tests">
      <div class="tests-row">
        <label class="field" style="flex:1;min-width:180px">測試用 model（留空＝用上面那個）
          <input type="text" class="mono" data-f="testModel" value="${esc(t?.model ?? '')}">
        </label>
        <button class="btn primary" data-act="test" ${busy ? 'disabled' : ''}>${busy ? '測試中…' : '執行測試'}</button>
      </div>
      <div style="margin-top:10px">${
        t?.results?.length
          ? t.results.map((r) => `
            <div class="result">
              <span class="icon ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✕'}</span>
              <span class="body">
                <span class="name">${esc(r.label)}</span>
                ${r.ms != null ? `<span class="detail"> ${r.ms}ms</span>` : ''}
                ${r.detail ? `<div class="detail">${esc(r.detail)}</div>` : ''}
                ${r.error ? `<div class="err">${esc(r.error)}</div>` : ''}
              </span>
            </div>`).join('')
          : '<span class="sub">尚未測試。前三項驗基本推論、SSE 串流、工具呼叫 —— 任一不過，Claude Code 在這個 provider 上就跑不起來。第四項驗 /effort 到不到得了模型，它壞掉不會報錯，只是模型變笨。</span>'
      }</div>
    </div>
  </section>`
}

function renderProviders() {
  return `
    <div class="note">
      Provider 必須提供 <strong>Anthropic Messages 格式</strong>的端點（<code>POST {baseUrl}/v1/messages</code>）。
      OpenAI 格式的端點不能直接填在這裡。
    </div>
    ${S.config.providers.map(providerCard).join('') || '<div class="card empty">還沒有 provider。</div>'}
    <button class="btn" data-act="add-provider">＋ 新增 Provider</button>`
}

// ── 路由規則 ───────────────────────────────────────────────────────
const MATCH_LABELS = {
  any: '任何請求',
  main: '只有主對話',
  subagent: '所有子 agent（含 Workflow / ultracode）',
  nested: '只有巢狀子 agent（agent 開的 agent）',
}

function renderRules() {
  const targetOpts = (sel) => `
    <option value="" ${sel ? '' : 'selected'}>— 選一個導向 —</option>
    <option value="passthrough" ${sel === 'passthrough' ? 'selected' : ''}>passthrough（訂閱）</option>
    ${S.config.providers
      .map((p) => `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}`

  const rows = S.config.rules.map((r, i) => `
    <div class="rule-row" data-rid="${esc(r.id)}">
      <input type="checkbox" data-f="enabled" ${r.enabled ? 'checked' : ''} title="啟用">
      <select data-f="match">${Object.entries(MATCH_LABELS)
        .map(([k, v]) => `<option value="${k}" ${r.match === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <input type="text" class="mono" data-f="modelGlob" value="${esc(r.modelGlob)}" title="model 名比對，支援 *">
      <select data-f="providerId">${targetOpts(r.providerId)}</select>
      <input type="text" class="mono" data-f="modelOverride" list="model-hints" value="${esc(r.modelOverride ?? '')}"
             placeholder="不改寫" title="改寫送出的 model 名，留空＝不改寫">
      <span>
        <button class="btn tiny" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn tiny" data-act="down" ${i === S.config.rules.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="btn tiny danger" data-act="del-rule">✕</button>
      </span>
    </div>`).join('')

  const pv = S.preview
  return `
    <div class="note">
      由上而下取<strong>第一條命中</strong>的規則；全部沒命中就走 passthrough，也就是原樣送到 Anthropic、由訂閱付帳。
      分流依據是 Claude Code 送出的 <code>x-claude-code-agent-id</code> header，只有 session 內 spawn 的子 agent 才帶它；
      <code>x-claude-code-parent-agent-id</code> 只有「agent 開的 agent」才有。
      <br><br>
      <strong>Workflow / ultracode 的 <code>agent()</code> 算第一層子 agent，沒有 parent header</strong>，
      所以要涵蓋它們必須選「所有子 agent」；選「只有巢狀」會一個都分流不到。
    </div>

    <div class="note">
      <strong>導向可以直接選 <code>passthrough（訂閱）</code>。</strong>
      第三方配額快用完時，把規則的導向從 provider 換成訂閱就好 —— 不用刪規則、不用清 API key，
      正在跑的 agent 下一個請求就會改走訂閱，設定即時生效不必重啟。
      <br><br>
      比「停用規則」好的地方是排序還在：多條規則疊著時，停用會讓流量掉到<strong>下一條</strong>規則去，
      而不是掉回訂閱。明確指向 passthrough 才是真的擋在那裡。
      流量記錄的「導向」欄滑鼠移上去會顯示命中的規則 id，可以確認是哪一條在作用。
      <br><br>
      <strong>「改寫 model」把送出去的 model 名換掉</strong>，留空＝不改寫。
      指向 provider 時它蓋過該 provider 自己的 Model 欄位；指向訂閱時，它就是讓子 agent 跑跟主對話不同模型的唯一辦法 ——
      Workflow 的 <code>agent()</code> 沒指定模型時一律沿用主對話的，主對話開 <code>fable</code> 整批 workflow 也會是 fable。
      填一條「所有子 agent → passthrough（訂閱）→ <code>claude-opus-5</code>」就能拉回來。
      <br><br>
      名字要填上游看得懂的完整 model 名。不確定的話，把主對話切到那個模型送一句話，
      再去<strong>流量記錄</strong>分頁的「要求 model」欄複製實際送出的字串最保險。
    </div>

    <datalist id="model-hints">
      <option value="claude-opus-5"></option>
      <option value="claude-sonnet-5"></option>
      <option value="claude-haiku-4-5-20251001"></option>
      <option value="claude-fable-5"></option>
    </datalist>

    <section class="card">
      <div class="card-head"><h3>預設去向（passthrough）</h3></div>
      <label class="field">Base URL
        <input type="text" class="mono" id="pt-base" value="${esc(S.config.passthrough.baseUrl)}">
      </label>
      <span class="hint">所有規則都沒命中、以及規則明確指向 passthrough 時的去向。憑證與 header 原樣轉發，body 除了規則指定的 model 改寫之外一個字不動 —— 這條線就是你的訂閱。除非另外架了 Anthropic 前置，否則不要改。</span>
    </section>

    <section class="card">
      <div class="card-head"><h3>規則</h3><span class="spacer"></span>
        <button class="btn tiny" data-act="add-rule">＋ 新增規則</button></div>
      <div class="rule-row" style="color:var(--muted);font-size:12px">
        <span>啟用</span><span>條件</span><span>model 比對</span><span>導向</span><span>改寫 model</span><span></span>
      </div>
      ${rows || '<div class="empty">沒有規則，所有流量都走訂閱。</div>'}
    </section>

    <section class="card">
      <div class="card-head"><h3>規則預覽</h3></div>
      <div class="tests-row">
        <label class="field">請求來源
          <select id="pv-kind">${[['main', '主對話'], ['subagent', '子 agent'], ['nested', '巢狀子 agent']]
            .map(([k, v]) => `<option value="${k}" ${S.pvKind === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        </label>
        <label class="field" style="flex:1;min-width:180px">請求的 model
          <input type="text" class="mono" id="pv-model" list="model-hints" value="${esc(S.pvModel)}">
        </label>
        <button class="btn" data-act="preview">預覽</button>
      </div>
      ${pv ? `<div style="margin-top:12px" class="mono">
        判定為 <strong>${esc(pv.kind)}</strong> →
        導向 <strong class="${pv.providerId ? 'status-ok' : 'status-muted'}">${esc(pv.target)}</strong>
        ・實送 model <strong>${
          pv.requestedModel === pv.sentModel
            ? esc(pv.sentModel)
            : `${esc(pv.requestedModel)} → ${esc(pv.sentModel)}`
        }</strong>
        ${pv.ruleId ? `・命中規則 ${esc(pv.ruleId)}` : '・無規則命中'}
      </div>` : ''}
    </section>`
}

// ── 流量記錄 ───────────────────────────────────────────────────────

/**
 * 只顯示目錄名，完整路徑放 title —— 路徑太長會把表格撐爛。
 * 認不出目錄時退而顯示 session id：沒有 session id 的請求根本不是 Claude Code 送的。
 */
function cwdCell(e) {
  const sess = e.sessionId ? `session ${e.sessionId}` : '沒有 session id・不是 Claude Code 送來的'
  if (!e.cwd) return `<span class="status-muted" title="${esc(sess)}">–</span>`
  const short = e.cwd.split(/[\\/]/).filter(Boolean).at(-1) || e.cwd
  return `<span title="${esc(e.cwd)}・${esc(sess)}">${esc(short)}</span>`
}

/** effort 被 dropFields 吃掉時要看得出來 —— 請求照樣 200，只是模型變笨。 */
function effortCell(e) {
  if (!e.effort) return '<span class="status-muted">–</span>'
  if (e.sentEffort === e.effort) return `<span class="status-ok">${esc(e.effort)}</span>`
  return `<span class="status-bad">${esc(e.effort)} → 已移除</span>`
}

/** 沒有 cwd 的背景請求（壓縮、預熱那幾種）只能靠形狀認出來，但形狀不含任何內容。 */
function shapeHint(e) {
  if (!e.shape) return ''
  const parts = [
    e.shape.messages != null ? `${e.shape.messages} 則 messages` : null,
    e.shape.system ? '有 system' : '無 system',
    e.shape.stream ? '串流' : '非串流',
    e.shape.maxTokens != null ? `max_tokens ${e.shape.maxTokens}` : null,
  ].filter(Boolean)
  return ` title="${esc(parts.join('・'))}"`
}

/**
 * 上游為什麼失敗，答案在這一格。Claude Code 撞到 429 / 5xx 時畫面上只寫
 * 「will retry in …」，那個秒數就是這裡的 retry-after。
 */
function statusCell(e) {
  // 200 但串流裡夾著 error 事件的那種，看起來成功、其實沒有 —— 不能塗成綠的
  const failed = e.error || e.status >= 400 || (e.status && e.detail)
  const cls = failed ? 'status-bad' : e.status ? 'status-ok' : 'status-muted'
  const hint = [
    e.detail,
    e.attempts > 1 ? `送出 ${e.attempts} 次，重送原因：${(e.retries || []).join(' → ')}` : null,
    e.retryAfter ? `retry-after: ${e.retryAfter}` : null,
    e.requestId ? `request-id: ${e.requestId}` : null,
  ].filter(Boolean).join('\n')
  const retry = e.retryAfter ? ` <span class="status-muted">·${esc(e.retryAfter)}s 後重試</span>` : ''
  const flag = e.status && e.status < 400 && e.detail ? ' ⚠' : ''
  // router 自己扛掉的重送：Claude Code 看到的是一次乾淨的成功，只有這裡看得出來扛了幾次
  const tries = e.attempts > 1 ? ` <span class="status-muted">×${e.attempts}</span>` : ''
  return `<td class="mono ${cls}"${hint ? ` title="${esc(hint)}"` : ''}>${
    e.error ? esc(e.error) : (e.status ?? '…')}${flag}${tries}${retry}</td>`
}

function renderLogs() {
  const rows = S.logs.map((e) => `
    <tr>
      <td class="mono">${esc(e.ts.slice(11, 19))}</td>
      <td class="mono">${esc(e.kind)}</td>
      <td class="mono">${cwdCell(e)}</td>
      <td class="mono"${shapeHint(e)}>${esc(e.path)}</td>
      <td class="mono">${esc(e.requestedModel ?? '–')}</td>
      <td title="${e.ruleId ? '命中規則 ' + esc(e.ruleId) : '無規則命中'}">${esc(e.target)}</td>
      <td class="mono">${esc(e.sentModel ?? '–')}</td>
      <td class="mono">${effortCell(e)}</td>
      ${statusCell(e)}
      <td class="mono">${e.ms != null ? e.ms + 'ms' : '…'}</td>
      <td class="mono status-muted">${esc((e.changes || []).join(' '))}</td>
    </tr>`).join('')

  return `
    <section class="card">
      <div class="card-head"><h3>最近的請求</h3>
        <span class="sub">每 3 秒更新・只記中繼資料，不記 prompt 內容・狀態與路徑欄移上去看細節</span>
        <span class="spacer"></span>
        <button class="btn tiny" data-act="clear-logs">清空</button></div>
      <div class="scroll">
        <table>
          <thead><tr><th>時間</th><th>來源</th><th>目錄</th><th>路徑</th><th>要求 model</th><th>導向</th><th>實送 model</th><th>思考</th><th>狀態</th><th>耗時</th><th>改寫</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="11" class="empty">還沒有流量。</td></tr>'}</tbody>
        </table>
      </div>
    </section>`
}

// ── 接入說明 ───────────────────────────────────────────────────────
function renderSetup() {
  const port = S.runtime.boundProxyPort
  return `
    <section class="card">
      <div class="card-head"><h3>1. 設定 Claude Code</h3></div>
      <p>在 <code>~/.claude/settings.json</code>（Windows：<code>%USERPROFILE%\\.claude\\settings.json</code>）的 <code>env</code> 區塊加入：</p>
      <pre id="snippet">{
  "env": {
    "ANTHROPIC_BASE_URL": "http://127.0.0.1:${port}",
    "CLAUDE_CODE_ATTRIBUTION_HEADER": "0"
  }
}</pre>
      <p style="margin-bottom:0"><button class="btn tiny" data-act="copy">複製</button></p>
      <div class="note warn" style="margin-top:14px">
        <strong>絕對不要</strong>同時設 <code>ANTHROPIC_AUTH_TOKEN</code>、<code>ANTHROPIC_API_KEY</code> 或 <code>apiKeyHelper</code>。
        官方文檔明載：只設 base URL 而不設憑證，claude.ai 訂閱登入會保留下來；一旦設了憑證，訂閱就整個被頂掉，全部流量改成按 token 計費。
      </div>
      <p class="hint" style="margin-bottom:0">
        <code>CLAUDE_CODE_ATTRIBUTION_HEADER=0</code> 是選配。Claude Code 會在 system prompt 前面加一段 attribution block，
        只有 <code>api.anthropic.com</code> 會自動剝掉，第三方 provider 會把它當成 prompt 的一部分收下去。關掉比較乾淨。
      </p>
    </section>

    <section class="card">
      <div class="card-head"><h3>2. 驗證訂閱還在</h3></div>
      <p>重開 Claude Code，執行 <code>/status</code>，確認 <strong>Status</strong> 分頁上：</p>
      <ul>
        <li><code>Anthropic base URL</code> 那行出現，指向 <code>http://127.0.0.1:${port}</code></li>
        <li>有 <code>Login method</code> 指向你的 claude.ai 帳號 —— <strong class="status-bad">不是</strong> <code>Auth token</code> 或 <code>API key</code></li>
      </ul>
      <p style="margin-bottom:0">看到 <code>Auth token</code> 就代表訂閱被頂掉了，回頭檢查有沒有殘留的環境變數。</p>
    </section>

    <section class="card">
      <div class="card-head"><h3>3. 確認分流真的生效</h3></div>
      <p style="margin-bottom:0">
        在 Claude Code 裡叫一個子 agent 做任何事，然後回到<strong>流量記錄</strong>分頁。
        主對話的請求「來源」欄應該是 <code>main</code>、導向 passthrough；子 agent 的是 <code>subagent</code>、導向你設定的 provider。
      </p>
    </section>

    <section class="card">
      <div class="card-head"><h3>已知限制</h3></div>
      <ul style="margin-bottom:0">
        <li>Anthropic 官方文檔明說不支援把 Claude Code 導到非 Claude 模型，壞了要自己修。</li>
        <li>Claude Code v2.1.196 起，<code>ANTHROPIC_BASE_URL</code> 指向非 Anthropic host 時 <strong>Remote Control 會停用</strong>。</li>
        <li><code>/fast</code> 的可用性檢查與 WebFetch 網域檢查直連 <code>api.anthropic.com</code>，不經過本 router。</li>
        <li>Claude Code 每次升級都可能新增 body 欄位，第三方 provider 收到會回 400；照錯誤訊息把欄位名加進該 provider 的「移除的 body 欄位」即可。</li>
        <li><code>/v1/messages/count_tokens</code> 若 provider 不支援會回 404，Claude Code 會自動退回用推論端點估算，不影響運作。</li>
      </ul>
    </section>`
}

// ── render / 事件 ─────────────────────────────────────────────────
function render() {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)))
  const view = $('#view')
  if (!S.config) { view.innerHTML = '<div class="card empty">載入中…</div>'; return }
  view.innerHTML = { providers: renderProviders, rules: renderRules, logs: renderLogs, setup: renderSetup }[S.tab]()
}

// 輸入時只更新 state，不重繪，避免游標跳走
document.addEventListener('input', (ev) => {
  const el = ev.target

  if (el.id === 'pt-base') {
    S.config.passthrough.baseUrl = el.value
    markDirty()
    return
  }

  const f = el.dataset.f
  if (!f) return

  const card = el.closest('[data-pid]')
  const row = el.closest('[data-rid]')

  if (card) {
    if (f === 'testModel') { (S.tests[card.dataset.pid] ??= {}).model = el.value; return }
    const p = S.config.providers.find((x) => x.id === card.dataset.pid)
    if (!p) return
    if (f === 'dropFields') p.dropFields = el.value.split(',').map((s) => s.trim()).filter(Boolean)
    else if (f === 'extraHeaders') p.extraHeaders = parseHeaders(el.value)
    else if (f === 'maxOutputTokens') p.maxOutputTokens = el.value ? Number(el.value) : null
    else if (el.type === 'checkbox') p[f] = el.checked
    else p[f] = el.value
    markDirty()
  } else if (row) {
    const r = S.config.rules.find((x) => x.id === row.dataset.rid)
    if (!r) return
    r[f] = el.type === 'checkbox' ? el.checked : el.value
    markDirty()
  }
})
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button')
  if (!btn) return

  if (btn.dataset.tab) {
    S.tab = btn.dataset.tab
    render()
    if (S.tab === 'logs') startLogPolling(); else stopLogPolling()
    return
  }

  const act = btn.dataset.act
  if (!act) return
  const pid = btn.closest('[data-pid]')?.dataset.pid
  const rid = btn.closest('[data-rid]')?.dataset.rid

  try {
    if (act === 'add-provider') {
      S.config.providers.push({
        id: 'p-' + Math.random().toString(36).slice(2, 10),
        label: '新 Provider', baseUrl: '', apiKey: '', model: '', authStyle: 'bearer',
        dropFields: [],
        dropBeta: true, maxOutputTokens: null, extraHeaders: {},
      })
      markDirty(); render()
    } else if (act === 'del-provider') {
      S.config.providers = S.config.providers.filter((p) => p.id !== pid)
      markDirty(); render()
    } else if (act === 'add-rule') {
      S.config.rules.push({
        id: 'r-' + Math.random().toString(36).slice(2, 10),
        enabled: true, match: 'subagent', modelGlob: '*',
        providerId: S.config.providers[0]?.id ?? 'passthrough', modelOverride: '',
      })
      markDirty(); render()
    } else if (act === 'del-rule') {
      S.config.rules = S.config.rules.filter((r) => r.id !== rid)
      markDirty(); render()
    } else if (act === 'up' || act === 'down') {
      const i = S.config.rules.findIndex((r) => r.id === rid)
      const j = act === 'up' ? i - 1 : i + 1
      if (j >= 0 && j < S.config.rules.length) {
        ;[S.config.rules[i], S.config.rules[j]] = [S.config.rules[j], S.config.rules[i]]
        markDirty(); render()
      }
    } else if (act === 'test') {
      const provider = S.config.providers.find((p) => p.id === pid)
      S.busy[pid] = true; render()
      try {
        const out = await api('POST', '/api/test', { provider, model: S.tests[pid]?.model })
        S.tests[pid] = { ...out, model: S.tests[pid]?.model ?? '' }
      } catch (err) {
        S.tests[pid] = { results: [{ id: 'x', label: '測試', ok: false, error: err.message }] }
      } finally {
        S.busy[pid] = false; render()
      }
    } else if (act === 'preview') {
      S.pvKind = $('#pv-kind').value
      S.pvModel = $('#pv-model').value
      S.preview = await api('POST', '/api/routing/preview', { kind: S.pvKind, model: S.pvModel, config: S.config })
      render()
    } else if (act === 'clear-logs') {
      await api('POST', '/api/logs/clear'); S.logs = []; render()
    } else if (act === 'copy') {
      await navigator.clipboard.writeText($('#snippet').textContent)
      btn.textContent = '已複製'
      setTimeout(() => { btn.textContent = '複製' }, 1200)
    }
  } catch (err) {
    alert('操作失敗：' + err.message)
  }
})

$('#save').addEventListener('click', async () => {
  const btn = $('#save')
  btn.disabled = true
  try {
    applyState(await api('PUT', '/api/config', S.config))
    render()
  } catch (err) {
    alert('儲存失敗：' + err.message)
    btn.disabled = false
  }
})

function startLogPolling() {
  const tick = async () => {
    try {
      S.logs = (await api('GET', '/api/logs')).entries
      if (S.tab === 'logs') render()
    } catch {}
  }
  tick()
  stopLogPolling()
  logTimer = setInterval(tick, 3000)
}
function stopLogPolling() { if (logTimer) { clearInterval(logTimer); logTimer = null } }

applyState(await api('GET', '/api/state'))
render()
</script>
</body>
</html>
