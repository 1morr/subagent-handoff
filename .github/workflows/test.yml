name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    # 整套測試幾秒跑完；卡住的測試不該佔著 runner 到預設的六小時
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 作者在 Windows 上開發，多數使用者不是 —— 兩邊都跑，路徑與換行的差異才會早點暴露
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 沒有任何 npm 依賴，所以不裝東西也不需要 lockfile 快取
      - run: npm test

  # 映像建得起來、容器裡的 router 從宿主的 127.0.0.1 連得到：ROUTER_HOST、/data volume 的權限
  # 與 compose 的埠發布要三者都對才會過，npm test 驗不到這一段
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: router answers on the published ports
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/ && curl -fsS -o /dev/null -I http://127.0.0.1:8787/api/hello; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
