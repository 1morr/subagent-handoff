name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    # 整套測試幾秒跑完；卡住的測試不該佔著 runner 到預設的六小時
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 作者在 Windows 上開發，多數使用者不是 —— 兩邊都跑，路徑與換行的差異才會早點暴露
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 沒有任何 npm 依賴，所以不裝東西也不需要 lockfile 快取
      - run: npm test

  # 映像建得起來、容器裡的 router 從宿主的 127.0.0.1 連得到：ROUTER_HOST、/data volume 的權限
  # 與 compose 的埠發布要三者都對才會過，npm test 驗不到這一段
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: router answers on the published ports
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/ && curl -fsS -o /dev/null -I http://127.0.0.1:8787/api/hello; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v

  # 推到 master 且容器冒煙通過才發布，讓使用者不必 clone 就能 `docker compose up`。
  # 沒有版本號（見 CHANGELOG.md 開頭），所以只有 latest 與 sha-<commit> 兩種 tag。
  # arm64 是給 NAS 與 Apple Silicon：映像沒有編譯步驟，QEMU 跨架構建置只多幾秒。
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
